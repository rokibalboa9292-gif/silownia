<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8" />

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

<title>Checklist + DniPraca</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>
<div id="auth-screen">

<div class="auth-box">

<h1>Logowanie</h1>

<input
type="email"
id="email"
placeholder="Email"
/>

<input
type="password"
id="password"
placeholder="Hasło"
/>

<button onclick="registerUser()">
Załóż konto
</button>

<button onclick="loginUser()">
Zaloguj
</button>

<button onclick="googleLogin()">
Google
</button>

<p id="auth-status"></p>

</div>

</div>
<!-- LOGIN SCREEN -->
<div id="login-screen">

<div class="login-box">

<h1 class="login-title">Logowanie</h1>

<input
type="text"
id="login"
placeholder="Login"
/>

<input
type="password"
id="password"
placeholder="Hasło"
/>

<button onclick="login()">
Zaloguj
</button>

<p id="login-error"></p>

</div>

</div>
<!-- PASEK KLUCZY -->
<div class="keys-banner">

<div class="keys-track">

<div class="keys-text">

<span>W</span>
<span>E</span>
<span>Ź</span>
<span>&nbsp;</span>
<span>K</span>
<span>L</span>
<span>U</span>
<span>C</span>
<span>Z</span>
<span>E</span>
<span>&nbsp;🗝️</span>
<span>🔑</span>

</div>

<div class="keys-text">

<span>W</span>
<span>E</span>
<span>Ź</span>

<span>K</span>

<span>U</span>
<span>C</span>
<span>Z</span>
<span>E</span>
<span>&nbsp;🗝️</span>
<span>🔑</span>

</div>

<div class="keys-text">

<span>W</span>
<span>E</span>
<span>Ź</span>
<span>&nbsp;</span>
<span>K</span>
<span>L</span>
<span>U</span>
<span>C</span>
<span>Z</span>
<span>E</span>
<span>&nbsp;🗝️</span>
<span>🔑</span>

</div>

</div>

</div>

<div class="section">

<h1>Checklist siłowni</h1>

<h2>Plan zajęć</h2>

<div class="week-days">

<button class="day-btn active"
onclick="showSchedule('Poniedziałek', this)">
Pon
</button>

<button class="day-btn"
onclick="showSchedule('Wtorek', this)">
Wt
</button>

<button class="day-btn"
onclick="showSchedule('Środa', this)">
Śr
</button>

<button class="day-btn"
onclick="showSchedule('Czwartek', this)">
Czw
</button>

<button class="day-btn"
onclick="showSchedule('Piątek', this)">
Pt
</button>

<button class="day-btn"
onclick="showSchedule('Sobota', this)">
Sob
</button>

<button class="day-btn"
onclick="showSchedule('Niedziela', this)">
Nd
</button>

</div>

<div class="schedule-box"
id="schedule-box"></div>

<div class="top-controls">
<button class="reset-btn"
onclick="logout()">

WYLOGUJ

</button>
<div class="mode-buttons">

<button class="mode-btn active"
id="eveningBtn">

WIECZÓR

</button>

<button class="mode-btn"
id="morningBtn">

RANO

</button>

</div>

<button class="reset-btn"
onclick="resetChecklist()">

RESET LISTY

</button>

</div>

<h2>Do wykonania</h2>

<div id="todo-list"></div>

<h2>Wykonane</h2>

<div id="done-list"></div>

</div>

<div class="section work-section">

<h1 class="work-title">DniPraca</h1>

<button class="work-btn select"
onclick="wybierzPlik()">

Utwórz nowy plik TXT

</button>

<button class="work-btn load"
onclick="zaladujPlik()">

Załaduj istniejący plik TXT

</button>

<div class="buttons">

<button class="work-btn morning"
onclick="dodajPoranna()">

Zmiana poranna
<br>
(6-15)

</button>

<button class="work-btn evening"
onclick="dodajWieczorna()">

Zmiana wieczorna
<br>
(15-22)

</button>

</div>

<div class="status"
id="status">

Nie wybrano pliku

</div>

<textarea id="podglad"
readonly></textarea>

</div>

<script type="module" src="script.js"></script>

</body>
  </html>
