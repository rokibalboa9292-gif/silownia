<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8" />

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

<title>Challenge Klub Workspace</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">

href="https://fonts.googleapis.com">

<link rel="stylesheet" href="style.css">
<link rel="icon" href="/icon-512.png">

<link rel="apple-touch-icon" href="/icon-512.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#000000">
</head>

<body>
  <script>
if ("serviceWorker" in navigator) {

    navigator.serviceWorker
    .register("/sw.js")
    .catch(err => console.log(err));

}
</script>
<div id="auth-screen">

<div class="auth-box">

<h1>Logowanie</h1>

<input
type="email"
id="email"
placeholder="Email"
/>

<input
type="password"
id="password"
placeholder="Hasło"
/>

<button id="registerBtn">
Załóż konto
</button>

<button id="loginBtn">
Zaloguj
</button>

<button id="googleBtn">
Google
</button>

<p id="auth-status"></p>

</div>

</div>

<!-- PASEK KLUCZY -->

<span>🔑</span>

</div>

</div>

</div>

<div class="section">

<h2>Plan zajęć</h2>

<div class="week-days">

<button class="day-btn active"
onclick="showSchedule('Poniedziałek', this)">
Pon
</button>

<button class="day-btn"
onclick="showSchedule('Wtorek', this)">
Wt
</button>

<button class="day-btn"
onclick="showSchedule('Środa', this)">
Śr
</button>

<button class="day-btn"
onclick="showSchedule('Czwartek', this)">
Czw
</button>

<button class="day-btn"
onclick="showSchedule('Piątek', this)">
Pt
</button>

<button class="day-btn"
onclick="showSchedule('Sobota', this)">
Sob
</button>

<button class="day-btn"
onclick="showSchedule('Niedziela', this)">
Nd
</button>

</div>
<h1>Checklista zadań zmianowych</h1>
<div class="schedule-box"
id="schedule-box"></div>

<div class="top-controls">
<button class="reset-btn"
onclick="logout()">

WYLOGUJ

</button>
<div class="mode-buttons">

<button class="mode-btn active"
id="eveningBtn">

WIECZÓR

</button>

<button class="mode-btn"
id="morningBtn">

RANO

</button>

</div>

<button class="reset-btn"
onclick="resetChecklist()">

RESET LISTY

</button>

</div>

<h2>Do wykonania</h2>

<div id="todo-list"></div>

<h2>Wykonane</h2>

<div id="done-list"></div>

</div>

<div class="section work-section">

<h1 class="work-title">Dni Pracy</h1>

<button class="work-btn select"
onclick="wyczyscDniPracy()">

Wyczyść wykaz pracy

</button>


<div class="buttons">

<button class="work-btn morning"
onclick="dodajPoranna()">

Zmiana poranna wykonano
<br>
(6-15)

</button>

<button class="work-btn evening"
onclick="dodajWieczorna()">

Zmiana wieczorna wykonano
<br>
(15-22)

</button>

</div>


<textarea id="podglad"
readonly></textarea>

</div>

<div class="section">

<h1>Kalkulator pieniędzy</h1>

<h2>Monety</h2>

<div class="money-grid">

<div class="money-item">
<label>5 zł</label>
<input type="number" id="coin5" value="0">
</div>

<div class="money-item">
<label>2 zł</label>
<input type="number" id="coin2" value="0">
</div>

<div class="money-item">
<label>1 zł</label>
<input type="number" id="coin1" value="0">
</div>

<div class="money-item">
<label>50 gr</label>
<input type="number" id="coin50" value="0">
</div>

</div>

<h2>Banknoty</h2>

<div class="money-grid">

<div class="money-item">
<label>10 zł</label>
<input type="number" id="bill10" value="0">
</div>

<div class="money-item">
<label>20 zł</label>
<input type="number" id="bill20" value="0">
</div>

<div class="money-item">
<label>50 zł</label>
<input type="number" id="bill50" value="0">
</div>

<div class="money-item">
<label>100 zł</label>
<input type="number" id="bill100" value="0">
</div>

<div class="money-item">
<label>200 zł</label>
<input type="number" id="bill200" value="0">
</div>

</div>

<button class="money-btn" id="moneyBtn">
POLICZ SUMĘ
</button>

<div class="money-results">

<p>Monety: <span id="coinsResult">0.00</span> zł</p>

<p>Banknoty: <span id="billsResult">0.00</span> zł</p>

<p><strong>RAZEM: <span id="totalResult">0.00</span> zł</strong></p>

</div>

</div>

  <div class="section story-section">

<h1>Dzisiejsze Story</h1>

<div class="story-preview-wrapper">

<canvas id="storyCanvas" width="1080" height="1920"></canvas>

</div>

<div class="story-buttons">

<button id="generateStoryBtn" class="story-btn">
GENERUJ STORY
</button>

<button id="downloadStoryBtn" class="story-btn download">
POBIERZ STORY
</button>

</div>

</div>
<script type="module" src="script.js"></script>

</body>
  </html>
