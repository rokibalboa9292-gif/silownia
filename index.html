<h1>Logowanie</h1>

/>

type="password"
id="password"

/>

</button>

<button onclick="loginUser()">

<div class="section">

<h2>Plan zajęć</h2>

<div class="week-days">

<button class="day-btn active"
onclick="showSchedule('Poniedziałek', this)">
Pon
</button>

<button class="day-btn"
onclick="showSchedule('Wtorek', this)">
Wt
</button>

<button class="day-btn"
onclick="showSchedule('Środa', this)">
Śr
</button>

<button class="day-btn"
onclick="showSchedule('Czwartek', this)">
Czw
</button>

<button class="day-btn"
onclick="showSchedule('Piątek', this)">
Pt
</button>

<button class="day-btn"
onclick="showSchedule('Sobota', this)">
Sob
</button>

<button class="day-btn"
onclick="showSchedule('Niedziela', this)">
Nd
</button>

</div>
<h1>Checklista zadań zmianowych</h1>
<div class="schedule-box"
id="schedule-box"></div>

<div class="top-controls">
<button class="reset-btn"
onclick="logout()">

WYLOGUJ

</button>
<div class="mode-buttons">

<button class="mode-btn active"
id="eveningBtn">

WIECZÓR

</button>

<button class="mode-btn"
id="morningBtn">

RANO

</button>

</div>

<button class="reset-btn"
onclick="resetChecklist()">

RESET LISTY

</button>

</div>

<h2>Do wykonania</h2>

<div id="todo-list"></div>

<h2>Wykonane</h2>

<div id="done-list"></div>

</div>

<div class="section work-section">

<h1 class="work-title">Dni Pracy</h1>

<button class="work-btn select"
onclick="wyczyscDniPracy()">

Wyczyść wykaz pracy

</button>


<div class="buttons">

<button class="work-btn morning"
onclick="dodajPoranna()">

Zmiana poranna wykonano
<br>
(6-15)

</button>

<button class="work-btn evening"
onclick="dodajWieczorna()">

Zmiana wieczorna wykonano
<br>
(15-22)

</button>

</div>


<textarea id="podglad"
readonly></textarea>

</div>
